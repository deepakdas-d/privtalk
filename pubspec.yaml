name: privtalk
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.8
  go_router: ^17.2.3
  flutter_webrtc: ^1.4.1
  permission_handler: ^12.0.1
  dio: ^5.9.2
  uuid: ^4.5.3
  logger: ^2.7.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.4.0
  flutter_launcher_icons: ^0.14.4
  connectivity_plus: ^7.1.1
  internet_connection_checker_plus: ^3.0.0
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  firebase_database: ^12.4.0
  googleapis_auth: ^2.3.1
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/logo.png"

  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/logo.png"

  adaptive_icon_monochrome: "assets/logo.png"

  remove_alpha_ios: true
